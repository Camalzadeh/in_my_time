name: Continuous Integration

on:
  push:
    branches:
      - main
      - features/**
  pull_request:
    branches:
      - main

jobs:
  ci_check:
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[no ci-cd]') &&
      !contains(github.event.head_commit.message, '[no ci]')

    # The test suite talks to a real MongoDB. It used to start
    # mongodb-memory-server instead, which downloads a mongod binary on every
    # cold cache and has no build for Alpine — a service container is both
    # faster and closer to production.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/inmytime_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # No --legacy-peer-deps: @ably-labs/react-hooks was the only package that
      # refused React 19, and it is gone.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build
