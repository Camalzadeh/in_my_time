# Local development. Nothing to do with production — the live site is on
# Vercel with its database in Atlas.
#
#   docker compose up          start  (first run does npm ci, a few minutes)
#   docker compose down        stop
#   docker compose down -v     wipe everything (node_modules, database, cache)
#
# Two decisions worth knowing about:
#
#   1. The database is a container, not Atlas, so development cannot write to
#      the live site. It starts empty — create a poll and fill it yourself.
#   2. node_modules and .next are named volumes rather than bind mounts. Every
#      file operation between the Windows host and the container is expensive,
#      and those two directories hold tens of thousands of small files.

name: inmytime-dev

services:
  web:
    image: node:22-alpine
    working_dir: /app
    # node_modules lives in a volume, so npm ci only runs on the first start.
    #
    # --webpack, not Turbopack. On a Windows bind mount Turbopack never
    # registers routes nested inside a bracketed directory: /api/polls/[id]
    # resolves, but /api/polls/[id]/vote and /finalize return 404 forever, even
    # after clearing .next. `next build` finds them, so it is a dev-server
    # issue rather than a code one. Webpack enumerates them correctly, and it
    # also honours the polling variables below.
    command: >
      sh -c "[ -d node_modules/next ] || npm ci --no-audit --no-fund;
             npm run dev -- --webpack --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      # Overrides env_file, so a stray Atlas URI in .env.local still cannot
      # send development writes to the live database.
      MONGODB_URI: mongodb://mongo:27017/inmytime
      # A separate database for the test suite, so `npm test` never wipes what
      # you were clicking through in the browser.
      MONGO_TEST_URI: mongodb://mongo:27017/inmytime_test
      NEXT_TELEMETRY_DISABLED: "1"
      # inotify events do not cross the Windows bind mount, so the watcher has
      # to poll. These are webpack's knobs, which is one reason dev runs with
      # --webpack rather than Turbopack (see the note above the command).
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    # The default WiredTiger cache claims half the host's RAM, which is
    # pointless here.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    # No published port: only the web service talks to it.
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  node_modules:
  next_cache:
  mongo_data:
